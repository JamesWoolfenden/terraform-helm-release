---
# yamllint disable rule:line-length
default_language_version:
  python: python3.11
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-json
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: pretty-format-json
        args:
          - --autofix
      - id: detect-private-key
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: ad1b27d73581aa16cca06fc4a0761fc563ffe8e8 # v1.5.6
    hooks:
      - id: forbid-tabs
        exclude_types: [python, javascript, dtd, markdown, makefile, xml]
        exclude: binary|\.bin$
  - repo: https://github.com/jameswoolfenden/pre-commit-shell
    rev: 062f0b028ae65827e04f91c1e6738cfcbe9b337f # v1.0.6
    hooks:
      - id: shell-lint
        exclude: template|\.template$
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: 5b5dddc4fb0f83c3ea1fc5616fa63e115dce83e0 # v0.49.1
    hooks:
      - id: markdownlint
  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530 # v1.38.0
    hooks:
      - id: yamllint
        name: yamllint
        description: This hook runs yamllint.
        entry: yamllint
        language: python
        types: [file, yaml]
  - repo: https://github.com/jameswoolfenden/pre-commit
    rev: c5bdf92051a9e574d62152d81a3bd98a71816dd3 # v0.1.62
    hooks:
      - id: terraform-fmt
        language_version: python3.11
      - id: tf2docs
        language_version: python3.11
  - repo: local
    hooks:
      - id: holden
        name: holden
        description: Scan Terraform (and CI/CD config) for policy violations (via locally-installed CLI)
        language: system
        entry: holden scan .
        pass_filenames: false
        types: [terraform]
        # pre-push, not pre-commit: a system hook resolves holden from $PATH,
        # and no CI runner has it. CI invokes `pre-commit run --all-files`,
        # whose default stage is pre-commit, so anything on that stage runs
        # there and fails with "Executable `holden` not found". pre-push still
        # gates every push from a machine that has holden installed, and is
        # skipped by the CI invocation.
        #
        # Requires `pre-commit install --hook-type pre-push` once per clone.
        stages: [pre-push]
  - repo: https://github.com/jameswoolfenden/pike
    rev: 274a37d353c80bd4e44a0a3b4f674d5d576e7c3a # v1.0.11
    hooks:
      - id: pike-docs-go
        args: ["readme", "-d", ".", "-i"]
